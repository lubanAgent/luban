name: Luban company checks

on:
  workflow_dispatch:

jobs:
  test:
    # Company adapters need a trusted runner with private module access.
    # Do not run untrusted PRs on this runner.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum
      - run: make check
