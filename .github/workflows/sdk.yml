name: SDK

on:
  pull_request:
    paths:
      - "sdk/**"
      - "scripts/check-sdk*"
      - "Makefile"
      - ".github/workflows/sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "scripts/check-sdk*"
      - "Makefile"
      - ".github/workflows/sdk.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.1", "1.25.x"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdk/go.sum
      - run: make check-sdk
